[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mixverse"
version = "0.1.0"
description = "MIXVERSE AI music creator and remix studio"
requires-python = ">=3.12,<3.14"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn[standard]>=0.30,<1", "python-multipart>=0.0.9",
  "pydantic>=2,<3", "numpy>=1.26", "scipy>=1.13", "soundfile>=0.12",
  "librosa>=0.10.2", "pyloudnorm>=0.1.1", "pedalboard>=0.9", "httpx>=0.27"
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27"]

[tool.setuptools.packages.find]
where = ["."]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: optional model/integration tests", "benchmark: machine-dependent benchmarks"]
